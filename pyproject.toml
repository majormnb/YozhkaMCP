[project]
name = "yozhka-mcp"
version = "0.1.0"
description = "Unofficial MCP server for Yozhka (Ёжка) kanban planner — https://yozhka.lukit.ru/"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "yozhka-mcp contributors" }]
dependencies = [
    "fastmcp>=4.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
]

[project.scripts]
yozhka-mcp = "yozhka_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yozhka_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
